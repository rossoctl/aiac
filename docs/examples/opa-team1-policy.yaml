# Example Rossoctl OPA AuthorizationPolicies (client-scoped, team1, target side)
#
# One client-scoped policy CR per managed service (D20), as the PDP Policy
# Writer (OPA) server-side-applies them under target side (the default
# enforcement side): github-agent and github-tool in the `team1` namespace.
# Each CR carries the two request packages (inbound/request +
# outbound/request). The `content` blocks are the exact output of
# `render_target_side` (src/aiac/pdp/service/policy/opa/rego.py) for the two
# stored SPMs of the demo policy: users dev-user (role developer) and
# test-user (role tester), the agent's two scopes and two operator roles, and
# the github-tool's four tools. Regenerate them from the generator when it
# changes; do not edit them by hand. (The writer also sets the label
# app.kubernetes.io/managed-by: aiac-pdp-policy-writer; this example, applied
# by hand, has no label.)
#
# THE CALLEE DECIDES. Each service checks the calls to itself in its own
# inbound package. The outbound package of every service is a pass-through
# (`allow := true`, D24): github-tool's inbound decides each tool call, and
# github-agent's outbound checks nothing (known limit: no egress check under
# target side).
#
# ALWAYS DENY BY DEFAULT (D25). Every rules-based package emits
# `default allow := false`: a request that no rule allows is denied. Each gate
# has an allow side and a mirrored deny side; a matching deny vetoes an allow.
# The identity maps (subject_roles, source_roles) are effect-agnostic. In this
# demo the deny maps are empty (an allow-only policy). No request without
# identity passes a rules-based inbound (D27): the subject gate needs a subject
# that holds a role.
#
# github-agent INBOUND (agent-level, D26a). Who may call the agent: the user
# gate (input.identity.subject -> subject_roles -> a role that grants one of
# agent_scopes) and the source gate (input.identity.client_id: no client_id or
# the platform client `rossoctl` passes, else source_roles).
#
# github-tool INBOUND (D26). Who may call which tool, through which agent: two
# gates, keyed by the bare MCP tool name (source-read, source-write,
# issues-read, issues-write) — the user gate (input.identity.subject ->
# subject_roles) and the calling-agent gate (input.identity.client_id, the
# calling agent's SPIFFE clientId -> source_roles). tool_ok(tool) holds when
# both gates allow the tool and neither denies it. A `tools/call` is allowed
# when tool_ok(input.mcp.params.name). The MCP session messages (initialize,
# notifications/initialized, ping, tools/list) carry no tool name: they are
# allowed when at least one tool of owned_tools passes tool_ok, or when the
# caller is the tool's own client (self_client_id; the UC-1 discovery token is
# minted as that client). Every other request is denied. There is no
# platform-client bypass on a tool inbound.
#
# THE CHANGED COMBINER (D20). In an AIAC setup the global combiner (the
# `default` CR in rossoctl-system, applied by k8s/opa-kind-enable.sh) has no
# `client_ok if not data.authbridge.client.<tier>.request` fallback: a pod that
# has no client CR is denied on both request legs. So every managed service has
# a CR (a pass-through where AIAC has no rules), and a deleted CR denies its pod.
#
# AGENT SIDE (AIAC_ENFORCEMENT_SIDE=agent-side) renders other CRs: the per-tool
# check is in github-agent's outbound package (generate_outbound_rego, keyed by
# input.identity.service_id), and github-tool gets a pass-through CR. See
# docs/specs/components/pdp-policy-writer-opa.md ("What each side renders").
#
# CLIENT-SCOPE TARGETING: bundle-service looks a client-scope CR up by
# metadata.name + metadata.namespace, matched against the ServiceAccount segment
# of the caller's SPIFFE ID (spiffe://<trust-domain>/ns/<namespace>/sa/<name>).
# spec.clientID is not used by that lookup; it must satisfy the CRD's DNS-label
# regex (no `spiffe://`, no `/`). The bundle-service combines each tier with the
# global combiner.
#
# Identity note: INBOUND the OPA plugin exposes input.identity.{subject,
# client_id, scopes} from the validated JWT. On github-tool's inbound the JWT is
# the exchanged token, so client_id is the calling agent's client. `subject` is
# the JWT `sub` claim, the username on every leg (D31). The one source is the
# client scope aiac-username-sub: the login token gets it from the link that AIAC
# makes to the rossoctl client (A.1 in k8s/opa-kind-runbook.md), and the
# exchanged token from the link that AIAC makes to each managed client
# (github-agent) at onboarding.
apiVersion: agent.rossoctl.dev/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: github-agent
  namespace: team1
spec:
  scope: client
  clientID: "github-agent"
  policies:
    - path: "inbound/request.rego"
      content: |
        package authbridge.client.inbound.request
        import rego.v1

        agent_scopes := ["github-agent.source_operations", "github-agent.issue_operations"]

        subject_roles := {
            "dev-user": ["developer"],
            "test-user": ["tester"],
        }
        source_roles := {}
        subject_role_allow_scopes := {
            "developer": ["github-agent.source_operations", "github-agent.issue_operations"],
            "tester": ["github-agent.issue_operations"],
        }
        subject_role_deny_scopes := {}
        source_role_allow_scopes := {}
        source_role_deny_scopes := {}

        subject_allow_ok if {
            some role in subject_roles[input.identity.subject]
            some scope in subject_role_allow_scopes[role]
            scope in agent_scopes
        }
        subject_deny_ok if {
            some role in subject_roles[input.identity.subject]
            some scope in subject_role_deny_scopes[role]
            scope in agent_scopes
        }
        source_allow_ok if { not input.identity.client_id }
        source_allow_ok if { input.identity.client_id == "rossoctl" }
        source_allow_ok if {
            some role in source_roles[input.identity.client_id]
            some scope in source_role_allow_scopes[role]
            scope in agent_scopes
        }
        source_deny_ok if {
            some role in source_roles[input.identity.client_id]
            some scope in source_role_deny_scopes[role]
            scope in agent_scopes
        }
        default allow := false
        allow if { subject_allow_ok; source_allow_ok; not subject_deny_ok; not source_deny_ok }
    - path: "outbound/request.rego"
      content: |
        package authbridge.client.outbound.request
        import rego.v1

        allow := true
---
apiVersion: agent.rossoctl.dev/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: github-tool
  namespace: team1
spec:
  scope: client
  clientID: "github-tool"
  policies:
    - path: "inbound/request.rego"
      content: |
        package authbridge.client.inbound.request
        import rego.v1

        owned_tools := ["source-read", "source-write", "issues-read", "issues-write"]

        subject_roles := {
            "dev-user": ["developer"],
            "test-user": ["tester"],
        }
        source_roles := {
            "spiffe://localtest.me/ns/team1/sa/github-agent": ["github-agent.source_operations", "github-agent.issue_operations"],
        }
        subject_role_allow_scopes := {
            "developer": ["source-read", "source-write", "issues-read"],
            "tester": ["issues-read", "issues-write"],
        }
        subject_role_deny_scopes := {}
        source_role_allow_scopes := {
            "github-agent.source_operations": ["source-read", "source-write"],
            "github-agent.issue_operations": ["issues-read", "issues-write"],
        }
        source_role_deny_scopes := {}
        session_methods := {"initialize", "notifications/initialized", "ping", "tools/list"}
        self_client_id := "spiffe://localtest.me/ns/team1/sa/github-tool"

        subject_allows(tool) if {
            some role in subject_roles[input.identity.subject]
            tool in subject_role_allow_scopes[role]
        }
        subject_denies(tool) if {
            some role in subject_roles[input.identity.subject]
            tool in subject_role_deny_scopes[role]
        }
        source_allows(tool) if {
            some role in source_roles[input.identity.client_id]
            tool in source_role_allow_scopes[role]
        }
        source_denies(tool) if {
            some role in source_roles[input.identity.client_id]
            tool in source_role_deny_scopes[role]
        }
        tool_ok(tool) if {
            subject_allows(tool)
            source_allows(tool)
            not subject_denies(tool)
            not source_denies(tool)
        }
        default allow := false
        allow if { input.mcp.method == "tools/call"; tool_ok(input.mcp.params.name) }
        allow if { input.mcp.method in session_methods; some tool in owned_tools; tool_ok(tool) }
        allow if { input.mcp.method in session_methods; input.identity.client_id == self_client_id }
    - path: "outbound/request.rego"
      content: |
        package authbridge.client.outbound.request
        import rego.v1

        allow := true
