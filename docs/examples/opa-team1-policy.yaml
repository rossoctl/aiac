# Example Rossoctl OPA AuthorizationPolicy (client-scoped, github-agent)
#
# One client-scoped policy CR for exactly one workload in the `team1` namespace:
# the github-agent. It carries one rego file per tier (inbound/request +
# outbound/request), as the PDP Policy Writer (OPA) server-side-applies it. The
# two `content` blocks are the exact output of `generate_inbound_rego` /
# `generate_outbound_rego` (src/aiac/pdp/service/policy/opa/rego.py) for the
# demo policy: users dev-user (role developer) and test-user (role tester), the
# agent's two scopes, and the github-tool's four tools. Regenerate them from the
# generator when it changes; do not edit them by hand.
#
# ALWAYS DENY BY DEFAULT. Both tiers emit `default allow := false`: a request that
# no rule allows is denied. Each tier has *_allow_ok gates and mirrored *_deny_ok
# gates; a matching deny gate blocks the request. The identity maps (subject_roles,
# source_roles) are effect-agnostic. In this demo the deny maps are empty
# (an allow-only policy).
#
# OUTBOUND. The outbound tier reads input.identity.subject (the delegated user),
# input.identity.service_id (the target the exchanged token was minted for — the
# github-tool SPIFFE ID), input.mcp.method and input.mcp.params.name (the invoked
# tool; the maps key on the bare MCP tool names source-read, source-write,
# issues-read, issues-write). A `tools/call` is allowed when the user's role AND
# the target both admit the invoked tool and no deny matches. The MCP session
# messages (initialize, notifications/initialized, ping, tools/list) carry no tool
# name: they are allowed to a target when at least one tool of that target passes
# that same per-tool check (`tool_ok`). Every other request is denied — also A2A
# and LLM calls through the agent's outbound proxy (see the known limit in
# docs/specs/components/pdp-policy-writer-opa.md).
#
# CLIENT-SCOPE TARGETING: bundle-service looks a client-scope CR up by
# metadata.name + metadata.namespace, matched against the ServiceAccount segment
# of the caller's SPIFFE ID (spiffe://<trust-domain>/ns/<namespace>/sa/<name>).
# spec.clientID is not used by that lookup; it must satisfy the CRD's DNS-label
# regex (no `spiffe://`, no `/`). The bundle-service combines each tier with the
# shipped global policy; a tier with no client package falls back to allow
# (`client_ok if not data.authbridge.client.<tier>`).
#
# Identity note: INBOUND the OPA plugin exposes input.identity.{subject,
# client_id, scopes}. OUTBOUND there is no validated JWT, so the plugin
# synthesizes input.identity from the token-exchange delegation hop. `subject` is
# the JWT `sub` claim; rossoctl-realm tokens carry the username in `sub` (via a
# username->sub protocol mapper — see A.1 in k8s/opa-kind-runbook.md).
apiVersion: agent.rossoctl.dev/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: github-agent
  namespace: team1
spec:
  scope: client
  clientID: "github-agent"
  policies:
    - path: "inbound/request.rego"
      content: |
        package authbridge.client.inbound.request
        import rego.v1

        agent_scopes := ["github-agent.issue_operations", "github-agent.source_operations"]

        subject_roles := {
            "dev-user": ["developer"],
            "test-user": ["tester"],
        }
        source_roles := {}
        subject_role_allow_scopes := {
            "developer": ["github-agent.issue_operations", "github-agent.source_operations"],
            "tester": ["github-agent.issue_operations"],
        }
        subject_role_deny_scopes := {}
        source_role_allow_scopes := {}
        source_role_deny_scopes := {}

        subject_allow_ok if {
            some role in subject_roles[input.identity.subject]
            some scope in subject_role_allow_scopes[role]
            scope in agent_scopes
        }
        subject_deny_ok if {
            some role in subject_roles[input.identity.subject]
            some scope in subject_role_deny_scopes[role]
            scope in agent_scopes
        }
        source_allow_ok if { not input.identity.client_id }
        source_allow_ok if { input.identity.client_id == "rossoctl" }
        source_allow_ok if {
            some role in source_roles[input.identity.client_id]
            some scope in source_role_allow_scopes[role]
            scope in agent_scopes
        }
        source_deny_ok if {
            some role in source_roles[input.identity.client_id]
            some scope in source_role_deny_scopes[role]
            scope in agent_scopes
        }
        default allow := false
        allow if { subject_allow_ok; source_allow_ok; not subject_deny_ok; not source_deny_ok }
    - path: "outbound/request.rego"
      content: |
        package authbridge.client.outbound.request
        import rego.v1

        agent_roles := ["github-agent.issue_operations", "github-agent.source_operations"]
        subject_roles := {
            "dev-user": ["developer"],
            "test-user": ["tester"],
        }
        subject_role_allow_scopes := {
            "developer": ["issues-read", "source-write", "source-read"],
            "tester": ["issues-read", "issues-write"],
        }
        subject_role_deny_scopes := {}
        # informational/debugging only — not referenced by allow
        agent_role_scopes := {
            "github-agent.issue_operations": ["issues-read", "issues-write"],
            "github-agent.source_operations": ["source-write", "source-read"],
        }
        target_allow_scopes := {
            "spiffe://localtest.me/ns/team1/sa/github-tool": ["source-read", "source-write", "issues-read", "issues-write"],
        }
        target_deny_scopes := {}
        session_methods := {"initialize", "notifications/initialized", "ping", "tools/list"}

        subject_allows(tool) if {
            some role in subject_roles[input.identity.subject]
            tool in subject_role_allow_scopes[role]
        }
        subject_allow_ok if { subject_allows(input.mcp.params.name) }
        subject_denies(tool) if {
            some role in subject_roles[input.identity.subject]
            tool in subject_role_deny_scopes[role]
        }
        subject_deny_ok if { subject_denies(input.mcp.params.name) }
        target_allows(tool) if {
            tool in target_allow_scopes[input.identity.service_id]
        }
        target_allow_ok if { target_allows(input.mcp.params.name) }
        target_denies(tool) if {
            tool in target_deny_scopes[input.identity.service_id]
        }
        target_deny_ok if { target_denies(input.mcp.params.name) }
        tool_ok(tool) if {
            subject_allows(tool)
            target_allows(tool)
            not subject_denies(tool)
            not target_denies(tool)
        }
        default allow := false
        allow if { input.mcp.method == "tools/call"; subject_allow_ok; target_allow_ok; not subject_deny_ok; not target_deny_ok }
        allow if { input.mcp.method in session_methods; some tool in target_allow_scopes[input.identity.service_id]; tool_ok(tool) }
