---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aiac-event-broker-config
  namespace: aiac-system
data:
  # nats-server has no level setting below its default, only verbosity flags ABOVE it, so the
  # container's command maps this key onto them (case-insensitive):
  #   TRACE -> -DV (debug + protocol trace)   DEBUG -> -D   anything else -> nats' default
  #   (INFO / WARNING / ERROR / CRITICAL all give the default notices + warnings + errors).
  # Change it with:
  #   kubectl patch configmap aiac-event-broker-config -n aiac-system --type merge \
  #     -p '{"data":{"LOG_LEVEL":"DEBUG"}}' \
  #     && kubectl rollout restart deployment/aiac-event-broker -n aiac-system
  # Restarting this broker drops the emptyDir JetStream data (see the volumes note below).
  LOG_LEVEL: "INFO"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiac-event-broker
  namespace: aiac-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiac-event-broker
  template:
    metadata:
      labels:
        app: aiac-event-broker
    spec:
      # The stock image runs as root by default. fsGroup makes the mounted JetStream data
      # volume group-writable by UID 10001, matching the rest of AIAC's non-root convention.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nats
          image: nats:2.14-alpine
          imagePullPolicy: IfNotPresent
          # Wrapped in sh so LOG_LEVEL (aiac-event-broker-config) can pick the verbosity flags;
          # exec keeps nats-server as PID 1 so it still receives SIGTERM directly.
          command:
            - sh
            - -c
            - |
              case "$(echo "${LOG_LEVEL:-INFO}" | tr '[:lower:]' '[:upper:]')" in
                TRACE) flags="-DV" ;;
                DEBUG) flags="-D" ;;
                *) flags="" ;;
              esac
              exec nats-server -js -sd /data/jetstream $flags
          envFrom:
            - configMapRef:
                name: aiac-event-broker-config
          ports:
            - containerPort: 4222
          # JetStream data lives on its own volume; the rest of the root filesystem is
          # read-only, so temp writes go to the /tmp emptyDir.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          # No HTTP health endpoint on a plain "-js" NATS server (no -m monitoring port), so
          # this uses tcpSocket like the repo's other non-HTTP workloads.
          readinessProbe:
            tcpSocket:
              port: 4222
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 4222
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: jetstream-data
              mountPath: /data/jetstream
            - name: tmp
              mountPath: /tmp
      volumes:
        # Dev-only: emptyDir means a pod restart or eviction drops the aiac-events stream and
        # any unacked messages. aiac-init recreates the stream, but in-flight messages are lost.
        # Fine while this broker is opt-in/inactive; switch to a PersistentVolumeClaim before
        # this is wired live.
        - name: jetstream-data
          emptyDir: {}
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: aiac-event-broker-service
  namespace: aiac-system
spec:
  selector:
    app: aiac-event-broker
  ports:
    - name: nats
      port: 4222
      targetPort: 4222
