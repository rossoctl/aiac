[project]
name = "aiac"
version = "0.1.0"
description = "AIAC — IdP configuration, PDP policy writer, and policy store services for Kagenti."
requires-python = ">=3.12"
# Runtime dependencies — union of the per-service requirements.txt files under src/aiac/.
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "python-keycloak",
    "python-dotenv",
    "requests",
    "kubernetes",
    "nats-py",
    "httpx",
    "langgraph",
    "langchain-openai",
    # chromadb: reserved for the not-yet-wired Phase-2 ChromaDB RAG policy source
    # (src/aiac/agent/policy_rules_builder/policy_source.py) — declared but never
    # imported/instantiated. Open advisories (GHSA-f4j7-r4q5-qw2c, GHSA-36p7-vc44-83pf,
    # GHSA-2wm9-hf6c-p5cr, GHSA-xph7-9rjv-w5fr) all require running the ChromaDB HTTP
    # server (the code-injection pair also needs trust_remote_code=true); AIAC runs no
    # such server, so none are reachable. No fixed version is published. Dependabot
    # alerts dismissed as not_used. Re-audit these before wiring the RAG server path.
    "chromadb",
    "tenacity",
]

[project.optional-dependencies]
# Test/dev tooling — install with: uv pip install -e ".[test]"
test = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
]

[tool.uv]
# cryptography is a transitive dep (jwcrypto -> python-keycloak). Floor it at
# 50.0.0 to clear GHSA-g6cj-pr64-35w5 (Bleichenbacher oracle, high) flagged by
# dependency-review against 49.0.0.
constraint-dependencies = ["cryptography>=50.0.0"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Apply excludes even to paths passed explicitly (e.g. by pre-commit / CI).
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# Production code under src/ is linted strictly. The test/eval/demo trees carry
# long-line prose inside triple-quoted docstrings and scenario fixtures (design
# notes, verbatim policy-pipeline descriptions) where a line-length wrap would
# either be impossible (inline `# noqa` can't sit inside a string) or would
# corrupt fixture text the tests assert on. E501 is relaxed for those trees only.
"test/**" = ["E501"]
"eval/**" = ["E501"]
"demo/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["test", "eval"]
pythonpath = ["src"]
# Selection is marker-only — no path is passed to pytest. testpaths collects both
# trees; the default `-m` below deselects every live-infra / eval marker, so a bare
# `pytest` is the offline unit suite. A command-line `-m` overrides the default
# (last `-m` wins): `-m integration`, `-m system`, `-m eval`, `-m llm`.
addopts = ["-m", "not integration and not system and not llm and not eval"]
markers = [
    "integration: several AIAC units cooperating in-process on a laptop — no cluster (opt in with `-m integration`)",
    "system: needs a live Kind cluster / Rosso / deployed AIAC — see k8s/opa-kind-runbook.md (opt in with `-m system`)",
    "llm: calls a real external LLM but needs no cluster; orthogonal tag on unit/integration tests (opt in with `-m llm`)",
    "eval: policy-pipeline evaluation suite under `eval/` — heavy, live-infra (opt in with `-m eval`)",
]
